name: Butler regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      BUTLER_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Backend, frontend and synthetic answer quality
        run: sh scripts/check.sh --junitxml=/tmp/butler-regression.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: butler-regression
          path: /tmp/butler-regression.xml
          if-no-files-found: ignore
